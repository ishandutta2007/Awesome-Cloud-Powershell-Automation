<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <style>
      .title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        fill: url(#textGrad);
      }
      .subtitle {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 14px;
        fill: #e2e8f0;
      }
      .floating-node {
        animation: float 6s ease-in-out infinite;
      }
      .pulse-line {
        stroke-dasharray: 8 8;
        animation: dash 15s linear infinite;
      }
      .orb-glow {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -100; }
      }
      @keyframes pulse {
        0% { opacity: 0.2; transform: scale(0.98); }
        100% { opacity: 0.5; transform: scale(1.02); }
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="800" y1="0" x2="800" y2="300"/>
    <line x1="1000" y1="0" x2="1000" y2="300"/>
  </g>

  <!-- Background Dynamic Network Connections (Behind Content) -->
  <g stroke="#6366f1" stroke-opacity="0.25" stroke-width="2" class="pulse-line">
    <path d="M 100 240 Q 250 80 450 220 T 850 100 T 1100 220" fill="none"/>
    <path d="M 50 80 Q 300 260 600 80 T 1050 240" fill="none"/>
  </g>

  <!-- Dynamic Decorative Nodes (Behind Content) -->
  <g class="orb-glow">
    <circle cx="150" cy="80" r="60" fill="url(#glowGrad)"/>
    <circle cx="1050" cy="220" r="80" fill="url(#glowGrad)"/>
  </g>

  <!-- Floating Dynamic Tech Pills (Positioned around borders/background) -->
  <g class="floating-node">
    <rect x="920" y="45" width="180" height="38" rx="19" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="1010" y="69" text-anchor="middle" class="badge-text" fill="#38bdf8">☁️ Azure Az</text>
  </g>
  <g class="floating-node" style="animation-delay: -2s;">
    <rect x="960" y="110" width="180" height="38" rx="19" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="1050" y="134" text-anchor="middle" class="badge-text" fill="#818cf8">⚡ AWS Tools</text>
  </g>
  <g class="floating-node" style="animation-delay: -4s;">
    <rect x="900" y="175" width="190" height="38" rx="19" fill="#1e293b" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="995" y="199" text-anchor="middle" class="badge-text" fill="#c084fc">🔧 PowerCLI / PVE</text>
  </g>

  <!-- FOREGROUND LAYER: Main Text and Branding (Guaranteed high visibility and contrast) -->
  <!-- PowerShell Terminal Window Icon Graphic -->
  <g transform="translate(65, 75)">
    <rect width="110" height="110" rx="16" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2"/>
    <rect width="110" height="28" rx="16" fill="#0369a1" fill-opacity="0.4"/>
    <circle cx="20" cy="14" r="4" fill="#ef4444"/>
    <circle cx="34" cy="14" r="4" fill="#eab308"/>
    <circle cx="48" cy="14" r="4" fill="#22c55e"/>
    <!-- Code Prompt Symbols >_ -->
    <text x="22" y="72" font-family="monospace" font-weight="bold" font-size="36" fill="#38bdf8">&gt;_</text>
    <text x="68" y="70" font-family="monospace" font-weight="bold" font-size="28" fill="#a855f7">PS</text>
  </g>

  <!-- Foreground Main Title & Subtitle -->
  <text x="205" y="125" class="title">Awesome Cloud PowerShell Automation ⚡</text>
  <text x="205" y="168" class="subtitle">Curated Cloud Infrastructure Management, Multi-Platform Cmdlets &amp; Automation</text>

  <!-- Bottom Info Pills -->
  <g transform="translate(205, 200)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="90" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">💻 Enterprise Scripting</text>
    
    <!-- Pill 2 -->
    <rect x="195" y="0" width="180" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="285" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">🌐 Multi-Cloud &amp; Hybrid</text>

    <!-- Pill 3 -->
    <rect x="390" y="0" width="180" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="480" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">🚀 Open-Source Cmdlets</text>
  </g>
</svg>
